<!--Q5. Created variables in app.component.ts and displaying them in app.component.html using interpolation {{ }}.-->
<div>
  <h1>Hello! Welcome to {{title()}}</h1>
  <p>Name: <span>{{name}}</span></p>
  <p>Age: <span>{{age}}</span></p>
  <p>City: <span>{{city}}</span></p>
  <p>Course: <span>{{course}}</span></p>
  <p>Status (student or not): <span>{{isStudent}}</span></p>
</div>
